<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Particle Universe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#fff;user-select:none}
canvas{display:block;position:fixed;inset:0;z-index:2}
video{display:none}
body::before{content:"";position:fixed;inset:-5vh -5vw;z-index:0;pointer-events:none;background:url("./spider-lily-bg.png") center 45%/78% auto no-repeat;opacity:.42;filter:saturate(.92) contrast(.92) brightness(.58);mix-blend-mode:screen}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.18),rgba(0,0,0,.54) 70%,rgba(0,0,0,.86))}
.flower-bg{position:fixed;inset:-5vh -5vw;z-index:0;pointer-events:none;background:url("./spider-lily-bg.png") center 45%/78% auto no-repeat;opacity:.42;filter:saturate(.92) contrast(.92) brightness(.58);mix-blend-mode:screen}
.flower-vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.18),rgba(0,0,0,.54) 70%,rgba(0,0,0,.86))}
@media(max-width:760px),(pointer:coarse){
  body::before{display:none}
  body::after{display:none}
  .flower-bg{background-image:url("./spider-lily-bg-mobile.jpg"),url("./spider-lily-bg.png");background-size:148% auto;background-position:center 45%;opacity:.62;filter:saturate(1) contrast(.98) brightness(.78)}
  .flower-vignette{background:radial-gradient(ellipse at center,rgba(0,0,0,.08),rgba(0,0,0,.4) 68%,rgba(0,0,0,.78))}
}

/* ===== 加载/开始覆盖 ===== */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.overlay.hidden{opacity:0;pointer-events:none}
#startOverlay{background:radial-gradient(ellipse at center,rgba(10,10,46,.85) 0%,rgba(0,0,0,.95) 70%)}
#startBtn{border:1px solid rgba(180,210,255,.5);background:rgba(255,255,255,.04);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:rgba(180,210,255,.9);font:600 18px 'Segoe UI',sans-serif;padding:14px 36px;border-radius:12px;cursor:pointer;letter-spacing:2px;transition:all .25s}
#startBtn:hover{background:rgba(100,180,255,.12);border-color:rgba(180,210,255,.7);box-shadow:0 0 30px rgba(100,180,255,.15)}
#loadingOverlay{background:radial-gradient(ellipse at center,rgba(10,10,46,.9) 0%,rgba(0,0,0,.95) 70%)}
.spinner{width:36px;height:36px;border:2px solid rgba(180,210,255,.15);border-top-color:rgba(180,210,255,.7);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:14px;color:rgba(180,210,255,.5);letter-spacing:1px}

/* ===== 手势状态指示 ===== */
.gesture-hud{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:25;text-align:center;pointer-events:none;transition:opacity .3s}
.gesture-hud .mode-text{font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(180,210,255,.6);text-shadow:0 0 20px rgba(100,150,255,.3)}
.gesture-hud .sub-text{font-size:11px;color:rgba(255,255,255,.25);margin-top:4px;letter-spacing:1px}

/* ===== 右上角按钮组 ===== */
.top-btns{position:fixed;top:14px;right:14px;z-index:30;display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.03);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:rgba(255,255,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s}
.icon-btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}

/* ===== 控制面板 ===== */
.panel{position:fixed;top:50%;right:16px;z-index:25;transform:translateY(-50%);width:210px;max-height:90vh;overflow-y:auto;padding:18px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(10,10,30,.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 40px rgba(0,0,0,.4);transition:opacity .35s,transform .35s}
.panel.collapsed{opacity:0;transform:translateY(-50%) translateX(30px);pointer-events:none}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.section-label{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:10px}

/* 模型网格 */
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px}
.model-btn{height:56px;border:1px solid rgba(255,255,255,.05);border-radius:10px;background:rgba(255,255,255,.02);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .2s}
.model-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.model-btn.active{border-color:rgba(100,180,255,.45);background:rgba(100,180,255,.06)}
.model-btn .icon{font-size:18px;line-height:1}
.model-btn .label{font-size:10px;color:rgba(255,255,255,.4);font-weight:500}
.model-btn.active .label{color:rgba(180,210,255,.8)}

/* 颜色 */
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.color-preview{width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.1);cursor:pointer;position:relative;overflow:hidden;flex-shrink:0}
.color-preview input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);border:none;cursor:pointer;opacity:0}
.color-hex{flex:1;height:28px;border:1px solid rgba(255,255,255,.06);border-radius:7px;background:rgba(255,255,255,.02);color:rgba(255,255,255,.6);font:12px monospace;padding:0 8px;outline:none;text-align:center}
.color-hex:focus{border-color:rgba(100,180,255,.35)}
.preset-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.dot{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:all .2s}
.dot:hover{transform:scale(1.25);border-color:rgba(255,255,255,.25)}
.dot.active{border-color:#fff;box-shadow:0 0 6px rgba(255,255,255,.3)}

/* 滑块 */
.slider-group{margin-bottom:14px}
.slider-row{display:flex;align-items:center;gap:8px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.08);outline:none}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:rgba(180,210,255,.85);cursor:pointer;box-shadow:0 0 6px rgba(100,180,255,.3)}
.slider-val{font-size:11px;color:rgba(255,255,255,.35);min-width:30px;text-align:right}

/* 底部提示 */
.footer{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;font-size:11px;color:rgba(255,255,255,.15);letter-spacing:1px;pointer-events:none}

/* 手部骨架叠加 */
#handCanvas{position:fixed;inset:0;z-index:2;pointer-events:none}

/* 雪花前景层 */
#snowCanvas{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .8s}
#snowCanvas.visible{opacity:1}

/* ===== 双手照片圣诞树 ===== */
.photo-upload{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.photo-upload.visible{display:flex}
.upload-box{width:min(420px,calc(100vw - 32px));padding:24px;border:1px solid rgba(180,210,255,.22);border-radius:8px;background:rgba(8,12,28,.86);box-shadow:0 18px 70px rgba(0,0,0,.55);text-align:center}
.upload-title{font-size:18px;font-weight:700;letter-spacing:2px;color:rgba(220,238,255,.92);margin-bottom:10px}
.upload-copy{font-size:13px;line-height:1.7;color:rgba(220,238,255,.55);margin-bottom:18px}
.upload-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;border:1px solid rgba(120,210,180,.5);border-radius:7px;background:rgba(80,210,160,.12);color:rgba(220,255,245,.9);font-size:14px;font-weight:650;letter-spacing:1px;cursor:pointer}
.upload-btn input{display:none}
.photo-layer{position:fixed;inset:0;z-index:12;pointer-events:none;perspective:900px}
.tree-photo{position:absolute;width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,.55);box-shadow:0 0 20px rgba(90,230,180,.18);opacity:0;transform:translate(-50%,-50%) scale(.35);transition:opacity .22s,transform .22s}
.tree-photo.visible{opacity:.88}
.tree-ornament{position:absolute;left:50%;top:50%;opacity:0;transform:translate(-50%,-50%) scale(.5);transition:opacity .2s;filter:drop-shadow(0 0 10px rgba(255,230,120,.55));will-change:transform}
.tree-ornament.visible{opacity:.96}
.orn-star{width:27px;height:27px;background:linear-gradient(135deg,#fff7a8,#ffcd29 55%,#d88a00);clip-path:polygon(50% 0%,61% 34%,98% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,2% 35%,39% 34%)}
.orn-topstar{width:64px;height:64px;background:linear-gradient(135deg,#fff9b8 0%,#ffd43b 42%,#b96b00 100%);clip-path:polygon(50% 0%,61% 34%,98% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,2% 35%,39% 34%);filter:drop-shadow(0 0 20px rgba(255,220,70,.95)) drop-shadow(0 0 44px rgba(255,170,20,.35))}
.orn-bell{width:22px;height:24px;background:linear-gradient(#ffe68a,#d79a16);border-radius:48% 48% 40% 40%;box-shadow:inset 3px 3px 5px rgba(255,255,255,.45)}
.orn-bell::after{content:"";position:absolute;left:7px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:#fff0a3}
.orn-gift{width:31px;height:28px;border-radius:4px;background:linear-gradient(90deg,#d7264d 0 38%,#ffd45c 38% 50%,#d7264d 50%);box-shadow:inset 0 12px 0 rgba(255,255,255,.12),0 0 14px rgba(255,80,120,.55);transform-style:preserve-3d}
.orn-gift::after{content:"";position:absolute;left:0;top:9px;width:100%;height:4px;background:#ffd45c}
.orn-ribbon{width:38px;height:8px;border-radius:999px;background:linear-gradient(90deg,#ff345c,#ffd45a,#ff345c);box-shadow:0 0 14px rgba(255,70,120,.65)}
.featured-photo{position:fixed;left:50%;top:50%;z-index:22;width:min(52vw,520px);height:min(62vh,620px);object-fit:contain;border-radius:10px;border:0;background:transparent;filter:drop-shadow(0 26px 52px rgba(0,0,0,.72)) drop-shadow(0 0 28px rgba(160,220,255,.22));opacity:0;transform:translate(-50%,-50%) scale(.84);transition:opacity .24s,transform .24s;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at center,#000 44%,rgba(0,0,0,.82) 59%,rgba(0,0,0,.28) 76%,transparent 100%);mask-image:radial-gradient(ellipse at center,#000 44%,rgba(0,0,0,.82) 59%,rgba(0,0,0,.28) 76%,transparent 100%)}
.featured-photo.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
.balloon-layer{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden}
.balloon{position:absolute;left:50%;bottom:-110px;width:28px;height:38px;border-radius:50% 50% 46% 46%;background:var(--balloon-color);box-shadow:inset -6px -8px 12px rgba(0,0,0,.18),inset 5px 5px 8px rgba(255,255,255,.38),0 0 18px color-mix(in srgb,var(--balloon-color),transparent 55%);animation:balloonFloat var(--dur) ease-out forwards}
.balloon::before{content:"";position:absolute;left:6px;top:5px;width:6px;height:10px;border-radius:50%;background:rgba(255,255,255,.45);transform:rotate(26deg)}
.balloon::after{content:"";position:absolute;left:50%;top:36px;width:1px;height:52px;background:rgba(255,255,255,.42);transform:translateX(-50%)}
@keyframes balloonFloat{
  0%{transform:translate3d(0,0,0) scale(.45);opacity:0}
  8%{opacity:.92}
  100%{transform:translate3d(var(--dx),calc(-100vh - 180px),0) scale(var(--scale));opacity:0}
}

@media(max-width:640px){
  .panel{right:8px;width:180px;padding:12px}
  .model-btn{height:48px}
}
</style>
</head>
<body>
<div class="flower-bg"></div>
<div class="flower-vignette"></div>

<!-- 覆盖层 -->
<div class="overlay" id="startOverlay">
  <button id="startBtn">START</button>
</div>
<div class="overlay hidden" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="load-text">Loading hand tracking model...</div>
</div>

<!-- 手势状态 -->
<div class="gesture-hud" id="gestureHud">
  <div class="mode-text" id="modeText">IDLE</div>
  <div class="sub-text" id="subText"></div>
</div>

<!-- 按钮 -->
<div class="top-btns">
  <button class="icon-btn" id="togglePanel" title="Panel">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="1.3" rx=".65" fill="currentColor"/><rect x="1" y="7.3" width="10" height="1.3" rx=".65" fill="currentColor"/><rect x="1" y="12.2" width="14" height="1.3" rx=".65" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn" id="btnFS" title="Fullscreen">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<!-- 面板 -->
<div class="panel" id="panel">
  <div class="section-label">Model</div>
  <div class="model-grid" id="modelGrid">
    <button class="model-btn active" data-model="heart"><span class="icon">&hearts;</span><span class="label">Heart</span></button>
    <button class="model-btn" data-model="flower"><span class="icon">&#10047;</span><span class="label">Flower</span></button>
    <button class="model-btn" data-model="saturn"><span class="icon">&#129668;</span><span class="label">Saturn</span></button>
    <button class="model-btn" data-model="firework"><span class="icon">&#10022;</span><span class="label">Firework</span></button>
    <button class="model-btn" data-model="galaxy"><span class="icon">&#127744;</span><span class="label">Galaxy</span></button>
    <button class="model-btn" data-model="dna"><span class="icon">&#129516;</span><span class="label">DNA</span></button>
  </div>

  <div class="section-label">Color</div>
  <div class="color-row">
    <div class="color-preview" id="colorPrev" style="background:#ff4488">
      <input type="color" id="colorPicker" value="#ff4488">
    </div>
    <input class="color-hex" id="colorHex" value="#ff4488" maxlength="7">
  </div>
  <div class="preset-row" id="presetRow"></div>

  <div class="section-label">Particles</div>
  <div class="slider-group">
    <div class="slider-row">
      <input type="range" id="countSlider" min="2000" max="30000" step="1000" value="12000">
      <span class="slider-val" id="countVal">12k</span>
    </div>
  </div>

  <div class="section-label">Size</div>
  <div class="slider-group">
    <div class="slider-row">
      <input type="range" id="sizeSlider" min="1" max="8" step=".5" value="3">
      <span class="slider-val" id="sizeVal">3</span>
    </div>
  </div>
</div>

<div class="footer">Drag to rotate · Scroll to zoom</div>

<div class="photo-upload" id="photoUpload">
  <div class="upload-box">
    <div class="upload-title">UPLOAD PHOTOS</div>
    <div class="upload-copy">双手模式会进入照片圣诞树程序。先选择几张照片，再用右手握拳生成圣诞树，左手张开和挥动切换照片。</div>
    <label class="upload-btn">
      选择照片
      <input type="file" id="photoInput" accept="image/*" multiple>
    </label>
  </div>
</div>
<div class="photo-layer" id="photoLayer"></div>
<img class="featured-photo" id="featuredPhoto" alt="">
<div class="balloon-layer" id="balloonLayer"></div>
<canvas id="snowCanvas"></canvas>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>

<!-- Three.js import map -->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== ELEMENTS ====================
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const loadingOverlay = document.getElementById('loadingOverlay');
const gestureHud = document.getElementById('gestureHud');
const modeText = document.getElementById('modeText');
const subText = document.getElementById('subText');
const panel = document.getElementById('panel');
const modelGrid = document.getElementById('modelGrid');
const colorPicker = document.getElementById('colorPicker');
const colorHex = document.getElementById('colorHex');
const colorPrev = document.getElementById('colorPrev');
const presetRow = document.getElementById('presetRow');
const countSlider = document.getElementById('countSlider');
const countVal = document.getElementById('countVal');
const sizeSlider = document.getElementById('sizeSlider');
const sizeVal = document.getElementById('sizeVal');
const photoUpload = document.getElementById('photoUpload');
const photoInput = document.getElementById('photoInput');
const photoLayer = document.getElementById('photoLayer');
const featuredPhoto = document.getElementById('featuredPhoto');
const balloonLayer = document.getElementById('balloonLayer');

const video = document.createElement('video');
video.muted = true; video.playsInline = true; video.style.display = 'none';
document.body.appendChild(video);

const handCanvas = document.getElementById('handCanvas') || document.createElement('canvas');
handCanvas.id = 'handCanvas';
handCanvas.style.cssText = 'position:fixed;inset:0;z-index:2;pointer-events:none';
document.body.appendChild(handCanvas);
const handCtx = handCanvas.getContext('2d');

// ==================== CONFIG ====================
const PRESETS = ['#ff4488','#ff6644','#ffaa22','#44dd88','#44aaff','#8866ff','#ff44cc','#ffffff','#00ffcc','#ff8800','#66ff66','#ff66aa'];
const IS_MOBILE = window.matchMedia('(max-width: 760px), (pointer: coarse)').matches;
const DEFAULT_PARTICLE_COUNT = IS_MOBILE ? 3600 : 14000;
const TARGET_FRAME_MS = IS_MOBILE ? 1000 / 20 : 0;
const PERF = {
  maxParticles: IS_MOBILE ? 9000 : 36000,
  pixelRatio: IS_MOBILE ? 1 : 2,
  photoThumbs: IS_MOBILE ? 14 : 40,
  ornaments: IS_MOBILE ? 20 : 76,
  snow: IS_MOBILE ? 50 : 520,
  bgStars: IS_MOBILE ? 450 : 2000,
  modelComplexity: IS_MOBILE ? 0 : 1,
  cameraWidth: IS_MOBILE ? 480 : 640,
  cameraHeight: IS_MOBILE ? 360 : 480,
};
let particleCount = DEFAULT_PARTICLE_COUNT;
let baseColor = new THREE.Color('#ff4488');
let currentModel = 'heart';
let pointSize = 3;
let gestureMode = 'idle'; // idle | love | fist | hands
let currentFingers = -1;
let manualModel = 'heart'; // user-selected model for idle
const HAND_TRACK_INTERVAL = IS_MOBILE ? 150 : 70;
let lastHandSend = 0;
let photoUrls = [];
let activePhotoIndex = 0;
let lastWaveX = null;
let lastWaveAt = 0;
let photoTreeData = [];
let photoNodes = [];
let ornamentNodes = [];
let photoTreeReady = false;
let photoDisplayMode = 'none';
let lastRenderAt = 0;
let balloonsActive = false;
let lastBalloonBurstAt = 0;

// Snow system
const SNOW_COUNT = PERF.snow;
let snowCanvas, snowCtx;
let snowParticles = [];
let snowVisible = false;

countSlider.value = particleCount;
countVal.textContent = particleCount >= 1000 ? `${particleCount / 1000}k` : String(particleCount);
countSlider.max = String(PERF.maxParticles);

// ==================== THREE.JS ====================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, PERF.pixelRatio));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000011, 0.0006);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 220);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.minDistance = 50;
controls.maxDistance = 600;

function resetFrontView(distance = 220) {
  camera.position.set(0, 0, distance);
  camera.up.set(0, 1, 0);
  controls.target.set(0, 0, 0);
  controls.update();
}

// Background stars
{
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(PERF.bgStars * 3);
  for (let i = 0; i < PERF.bgStars; i++) {
    pos[i*3] = (Math.random()-.5)*1600; pos[i*3+1] = (Math.random()-.5)*1600; pos[i*3+2] = (Math.random()-.5)*1600;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x6666aa, size: 0.8, transparent: true, opacity: 0.35, sizeAttenuation: true })));
}

// ==================== PARTICLE SYSTEM ====================
let geometry, material, points;
let positions, targetPositions, colors, sizes, phases, animProgress;
let transitioning = false;

function initParticles(count) {
  if (points) { scene.remove(points); geometry.dispose(); material.dispose(); }
  particleCount = count;
  positions = new Float32Array(count * 3);
  targetPositions = new Float32Array(count * 3);
  colors = new Float32Array(count * 3);
  sizes = new Float32Array(count);
  phases = new Float32Array(count);
  animProgress = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    positions[i*3]   = (Math.random()-.5)*300;
    positions[i*3+1] = (Math.random()-.5)*300;
    positions[i*3+2] = (Math.random()-.5)*300;
    targetPositions[i*3]   = positions[i*3];
    targetPositions[i*3+1] = positions[i*3+1];
    targetPositions[i*3+2] = positions[i*3+2];
    colors[i*3] = baseColor.r; colors[i*3+1] = baseColor.g; colors[i*3+2] = baseColor.b;
    sizes[i] = pointSize * (0.4 + Math.random()*0.6);
    phases[i] = Math.random() * Math.PI * 2;
    animProgress[i] = 1;
  }

  geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

  material = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float size; attribute float phase; attribute vec3 color;
      varying vec3 vColor; varying float vAlpha;
      uniform float uTime; uniform float uPixelRatio;
      void main(){
        vColor = color;
        float tw = 0.6 + 0.4 * sin(uTime * 2.0 + phase);
        vAlpha = tw;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = max(size * uPixelRatio * (200.0 / -mv.z) * tw, 1.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vAlpha;
      void main(){
        float d = length(gl_PointCoord - vec2(0.5));
        if(d > 0.5) discard;
        float core = smoothstep(0.5, 0.0, d);
        float glow = smoothstep(0.5, 0.12, d);
        float outer = smoothstep(0.5, 0.3, d) * 0.12;
        vec3 c = vColor * (core*0.9 + glow*0.58 + outer);
        float white = smoothstep(0.1, 0.0, d) * 0.65;
        c += vec3(white);
        gl_FragColor = vec4(c, min((core*1.0 + glow*0.52) * vAlpha, 1.0));
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });

  points = new THREE.Points(geometry, material);
  scene.add(points);
  applyModelTargets();
}

// ==================== 3D SHAPE GENERATORS ====================
function applyModelTargets() {
  if (gestureMode === 'idle') {
    setModelShape(manualModel);
  }
}

function setModelShape(model) {
  currentModel = model;
  const n = particleCount;
  switch(model) {
    case 'heart': genHeart(n); break;
    case 'flower': genFlower(n); break;
    case 'saturn': genSaturn(n); break;
    case 'firework': genFirework(n); break;
    case 'galaxy': genGalaxy(n); break;
    case 'dna': genDNA(n); break;
  }
  startTransition();
}

function startTransition() {
  for (let i = 0; i < particleCount; i++) animProgress[i] = -Math.random() * 0.6;
  transitioning = true;
}

function genHeart(n) {
  for (let i = 0; i < n; i++) {
    const u = Math.random() * Math.PI * 2;
    const r = 0.75 + Math.random() * 0.5;
    const x = 16 * Math.pow(Math.sin(u), 3);
    const y = 13*Math.cos(u) - 5*Math.cos(2*u) - 2*Math.cos(3*u) - Math.cos(4*u);
    const z = (Math.random()-.5) * 5;
    const s = r * 5;
    targetPositions[i*3] = x*s; targetPositions[i*3+1] = y*s; targetPositions[i*3+2] = z*s;
  }
}

function genFlower(n) {
  for (let i = 0; i < n; i++) {
    const t = Math.random() * Math.PI * 2;
    const pa = t * 6;
    const r = (40 + 30*Math.cos(pa)) * (0.5 + 0.5*Math.cos(pa));
    const layer = Math.random();
    targetPositions[i*3] = r*Math.cos(t)*(0.8+layer*.4);
    targetPositions[i*3+1] = (Math.random()-.5)*12 + layer*6*Math.sin(pa*.5);
    targetPositions[i*3+2] = r*Math.sin(t)*(0.8+layer*.4);
  }
}

function genSaturn(n) {
  const sn = Math.floor(n*0.45);
  for (let i = 0; i < sn; i++) {
    const phi = Math.acos(2*Math.random()-1), th = Math.random()*Math.PI*2;
    const r = 35 * Math.cbrt(Math.random());
    targetPositions[i*3] = r*Math.sin(phi)*Math.cos(th);
    targetPositions[i*3+1] = r*Math.cos(phi)*0.7;
    targetPositions[i*3+2] = r*Math.sin(phi)*Math.sin(th);
  }
  for (let i = sn; i < n; i++) {
    const a = Math.random()*Math.PI*2, r = 55+Math.random()*45;
    const tk = (Math.random()-.5)*5;
    targetPositions[i*3] = r*Math.cos(a);
    targetPositions[i*3+1] = tk - r*Math.sin(a)*0.08;
    targetPositions[i*3+2] = r*Math.sin(a)*0.96;
  }
}

function genFirework(n) {
  const bc = 5, pp = Math.floor(n/bc);
  for (let b = 0; b < bc; b++) {
    const cx=(Math.random()-.5)*180, cy=(Math.random()-.5)*180, cz=(Math.random()-.5)*80;
    const br = 25+Math.random()*35;
    for (let j = 0; j < pp; j++) {
      const idx = b*pp+j; if(idx>=n)break;
      const phi=Math.acos(2*Math.random()-1), th=Math.random()*Math.PI*2;
      const r = br*Math.pow(Math.random(),.4);
      targetPositions[idx*3] = cx+r*Math.sin(phi)*Math.cos(th);
      targetPositions[idx*3+1] = cy+r*Math.cos(phi);
      targetPositions[idx*3+2] = cz+r*Math.sin(phi)*Math.sin(th);
    }
  }
  for (let i = bc*pp; i < n; i++) {
    targetPositions[i*3]=(Math.random()-.5)*250; targetPositions[i*3+1]=(Math.random()-.5)*250; targetPositions[i*3+2]=(Math.random()-.5)*100;
  }
}

function genGalaxy(n) {
  for (let i = 0; i < n; i++) {
    const arm = i % 4, aa = (arm/4)*Math.PI*2, t = Math.random();
    const r = t*120, sp = (Math.random()-.5)*(8+r*.15);
    const sa = aa + t*3.5;
    targetPositions[i*3] = r*Math.cos(sa)+sp*Math.cos(sa+Math.PI/2);
    targetPositions[i*3+1] = (Math.random()-.5)*(4+r*.06)*Math.exp(-t*1.5);
    targetPositions[i*3+2] = r*Math.sin(sa)+sp*Math.sin(sa+Math.PI/2);
  }
}

function genDNA(n) {
  for (let i = 0; i < n; i++) {
    const t=i/n, y=(t-.5)*180, a=t*4*Math.PI*2, s=i%3;
    let x,z;
    if(s<2){const r=30+(Math.random()-.5)*4; x=r*Math.cos(a+s*Math.PI); z=r*Math.sin(a+s*Math.PI);}
    else{const rt=Math.random(); x=30*(Math.cos(a)*rt+Math.cos(a+Math.PI)*(1-rt)); z=30*(Math.sin(a)*rt+Math.sin(a+Math.PI)*(1-rt));}
    targetPositions[i*3]=x+(Math.random()-.5)*2; targetPositions[i*3+1]=y; targetPositions[i*3+2]=z+(Math.random()-.5)*2;
  }
}

// ==================== LOVE: L + heart + E (3D) ====================
function genLove(n) {
  // Split particles: L (20%), heart (60%), E (20%)
  const lCount = Math.floor(n * 0.2);
  const heartCount = Math.floor(n * 0.6);
  const eCount = n - lCount - heartCount;

  // "L" shape segments
  const lSegs = [[.05,.08,.05,.92],[.05,.92,.45,.92]];
  sampleSegsToTarget(lSegs, 0, lCount, -110, 0, 180);

  // Heart (parametric)
  for (let i = 0; i < heartCount; i++) {
    const idx = lCount + i;
    const u = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * (0.96 + Math.random() * 0.08);
    const x = 16 * Math.pow(Math.sin(u), 3);
    const y = 13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u);
    targetPositions[idx*3] = x*r*3.8;
    targetPositions[idx*3+1] = y*r*3.8 - 5;
    targetPositions[idx*3+2] = (Math.random()-.5)*2;
  }

  // "E" shape
  const eSegs = [[.55,.08,.55,.92],[.55,.08,.98,.08],[.55,.5,.9,.5],[.55,.92,.98,.92]];
  sampleSegsToTarget(eSegs, lCount+heartCount, eCount, 110, 0, 180);

  startTransition();
}

function sampleSegsToTarget(segs, offset, count, offX, offY, scale) {
  const stroke = 0.18;
  const weighted = [];
  let totalLen = 0;
  for (const s of segs) {
    const len = Math.hypot(s[2] - s[0], s[3] - s[1]);
    if (len < 1e-6) continue;
    totalLen += len;
    weighted.push({ s, len, acc: totalLen });
  }
  for (let i = 0; i < count; i++) {
    const pick = (i / count + Math.random() / count) * totalLen;
    const item = weighted.find(w => pick <= w.acc) || weighted[weighted.length - 1];
    const [x1, y1, x2, y2] = item.s;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.max(item.len, 1e-6);
    const nx = -dy / len, ny = dx / len;
    const t = Math.random();
    const across = (Math.random() - 0.5) * stroke;
    const along = (Math.random() - 0.5) * stroke * 0.35;
    const px = x1 + dx * t + nx * across + (dx / len) * along;
    const py = y1 + dy * t + ny * across + (dy / len) * along;
    const idx = offset + i;
    targetPositions[idx*3] = (px-0.5)*scale + offX;
    targetPositions[idx*3+1] = -(py-0.5)*scale + offY;
    targetPositions[idx*3+2] = (Math.random()-.5)*1.5;
  }
}

// ==================== HAND SHAPE (3D) ====================
const HAND_CONNS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function genHandShape(lmsArr, count) {
  // lmsArr: array of {x,y,z} normalized 0-1
  const segs = [];
  let totalLen = 0;
  for (const [a,b] of HAND_CONNS) {
    const l = Math.hypot(lmsArr[b].x-lmsArr[a].x, lmsArr[b].y-lmsArr[a].y);
    segs.push({a,b,l}); totalLen += l;
  }
  const spacing = totalLen / count;
  const pts = [];
  let dist = spacing * 0.5;
  for (const seg of segs) {
    let d = dist;
    while (d <= seg.l && pts.length < count) {
      const t = d / seg.l;
      pts.push({
        x: lmsArr[seg.a].x + (lmsArr[seg.b].x-lmsArr[seg.a].x)*t,
        y: lmsArr[seg.a].y + (lmsArr[seg.b].y-lmsArr[seg.a].y)*t,
        z: (lmsArr[seg.a].z||0) + ((lmsArr[seg.b].z||0)-(lmsArr[seg.a].z||0))*t
      });
      d += spacing;
    }
    dist = d - seg.l;
  }
  while (pts.length < count) pts.push(pts[pts.length-1]||{x:.5,y:.5,z:0});

  const scale = 200;
  for (let i = 0; i < count; i++) {
    targetPositions[i*3]   = (pts[i].x - 0.5) * scale;
    targetPositions[i*3+1] = -(pts[i].y - 0.5) * scale;
    targetPositions[i*3+2] = (pts[i].z || 0) * scale * 0.5;
  }
  startTransition();
}

function genDualHand(h1, h2, count) {
  const half = Math.floor(count / 2);
  const segs1 = [], segs2 = [];
  let tl1 = 0, tl2 = 0;
  for (const [a, b] of HAND_CONNS) {
    const l1 = Math.hypot(h1[b].x - h1[a].x, h1[b].y - h1[a].y);
    const l2 = Math.hypot(h2[b].x - h2[a].x, h2[b].y - h2[a].y);
    segs1.push({ a, b, l: l1 }); tl1 += l1;
    segs2.push({ a, b, l: l2 }); tl2 += l2;
  }

  sampleLmsToTarget(h1, segs1, tl1, 0, half, -50);
  sampleLmsToTarget(h2, segs2, tl2, half, count - half, 50);
}

function sampleLmsToTarget(lms, segs, totalLen, offset, count, xOff) {
  const spacing = totalLen / count;
  const pts = [];
  let dist = spacing*0.5;
  for (const seg of segs) {
    let d = dist;
    while(d<=seg.l && pts.length<count){
      const t=d/seg.l;
      pts.push({x:lms[seg.a].x+(lms[seg.b].x-lms[seg.a].x)*t,y:lms[seg.a].y+(lms[seg.b].y-lms[seg.a].y)*t,z:(lms[seg.a].z||0)+((lms[seg.b].z||0)-(lms[seg.a].z||0))*t});
      d+=spacing;
    }
    dist=d-seg.l;
  }
  while(pts.length<count) pts.push(pts[pts.length-1]||{x:.5,y:.5,z:0});
  const scale=200;
  for(let i=0;i<count;i++){
    const idx=offset+i;
    targetPositions[idx*3]=(pts[i].x-0.5)*scale+xOff;
    targetPositions[idx*3+1]=-(pts[i].y-0.5)*scale;
    targetPositions[idx*3+2]=(pts[i].z||0)*scale*0.5;
  }
}

// ==================== PHOTO TREE (DUAL HAND MODE) ====================
function showPhotoUpload() {
  if (!photoUrls.length) photoUpload.classList.add('visible');
}

function hidePhotoUpload() {
  photoUpload.classList.remove('visible');
}

function setFeaturedPhoto(index) {
  if (!photoUrls.length) return;
  activePhotoIndex = (index + photoUrls.length) % photoUrls.length;
  featuredPhoto.src = photoUrls[activePhotoIndex];
}

function createPhotoNodes() {
  photoLayer.innerHTML = '';
  photoNodes = [];
  ornamentNodes = [];
  const count = Math.min(photoUrls.length, PERF.photoThumbs);
  for (let i = 0; i < count; i++) {
    const img = document.createElement('img');
    img.className = 'tree-photo';
    img.src = photoUrls[i % photoUrls.length];
    img.alt = '';
    photoLayer.appendChild(img);
    photoNodes.push(img);
  }
  createTreeOrnaments();
  if (photoUrls.length) setFeaturedPhoto(Math.floor(Math.random() * photoUrls.length));
}

function createTreeOrnaments() {
  const types = ['star','bell','gift','ribbon','star','bell','gift','ribbon','star','bell','ribbon','bell'];
  const total = PERF.ornaments;
  for (let i = 0; i < total; i++) {
    const type = i === 0 ? 'topstar' : types[i % types.length];
    const node = document.createElement('div');
    node.className = `tree-ornament orn-${type}`;
    const level = type === 'topstar' ? 0 : type === 'gift' ? 0.91 + Math.random() * 0.07 : 0.04 + Math.pow(Math.random(), 1.85) * 0.9;
    const spread = Math.max(0.1, level);
    const radius = type === 'topstar' ? 0 : type === 'gift' ? 42 + Math.random() * 40 : type === 'ribbon' ? 18 + spread * 82 : 12 + spread * 78;
    node.dataset.type = type;
    node.dataset.level = String(level);
    node.dataset.radius = String(radius);
    node.dataset.angle = String(type === 'gift' ? Math.PI / 2 + (Math.random() - 0.5) * 0.85 : Math.random() * Math.PI * 2);
    node.dataset.spin = String(0.22 + Math.random() * 0.16);
    node.dataset.scale = String(type === 'topstar' ? (IS_MOBILE ? 0.78 : 1) : type === 'gift' ? 0.92 + Math.random() * 0.35 : type === 'ribbon' ? 0.82 + Math.random() * 0.45 : 0.72 + Math.random() * 0.55);
    node.dataset.scatterX = String((Math.random() - 0.5) * 330);
    node.dataset.scatterY = String((Math.random() - 0.5) * 235);
    node.dataset.scatterZ = String((Math.random() - 0.5) * 210);
    photoLayer.appendChild(node);
    ornamentNodes.push(node);
  }
}

function initPhotoTreeData() {
  photoTreeData = [];
  const starCount = Math.min(Math.floor(particleCount * 0.05), 520);
  const trunkCount = Math.floor(particleCount * 0.02);
  const giftCount = Math.floor(particleCount * 0.035);
  const ornamentTypes = ['red','gold','white','bell','bell','star_dot','candy','light','light','light','ribbon','ribbon'];

  for (let i = 0; i < particleCount; i++) {
    const isStar = i < starCount;
    const isTrunk = !isStar && i < starCount + trunkCount;
    const isGift = !isTrunk && i < starCount + trunkCount + giftCount;

    let y, radius, angle, ornament = '';

    if (isStar) {
      // Star topper + halo
      const isHalo = i > starCount * 0.6;
      y = 108 + (Math.random() - 0.5) * (isHalo ? 24 : 12);
      radius = isHalo ? 10 + Math.random() * 8 : Math.random() * 6;
      angle = Math.random() * Math.PI * 2;
      ornament = isHalo ? 'halo' : 'star';
    } else if (isTrunk) {
      // Tree trunk
      y = -100 + Math.random() * 18;
      radius = 5 + Math.random() * 8;
      angle = Math.random() * Math.PI * 2;
      ornament = 'trunk';
    } else if (isGift) {
      // Gift pile at base
      y = -92 + Math.random() * 14;
      radius = 25 + Math.random() * 40;
      angle = Math.random() * Math.PI * 2;
      ornament = ['gift_red','gift_blue','gift_gold'][Math.floor(Math.random() * 3)];
    } else {
      // Tree body
      const level = Math.random();
      y = -96 + Math.pow(level, 0.86) * 205;
      const taper = Math.max(0.05, 1 - level);
      const tier = Math.floor(level * 10);
      const branchBand = 0.74 + 0.26 * Math.cos((level * 10 - tier) * Math.PI);
      const surface = Math.pow(Math.random(), 0.42);
      radius = (6 + taper * 82 * branchBand) * surface;
      angle = Math.random() * Math.PI * 2;

      // Decorations on tree surface
      const rnd = Math.random();
      if (surface > 0.52 && rnd < 0.24) {
        ornament = ornamentTypes[Math.floor(Math.random() * ornamentTypes.length)];
      }
    }

    photoTreeData.push({
      angle,
      radius,
      y,
      spin: 0.32 + Math.random() * 0.22,
      bob: Math.random() * Math.PI * 2,
      scatterX: (Math.random() - 0.5) * 260,
      scatterY: (Math.random() - 0.5) * 190,
      scatterZ: (Math.random() - 0.5) * 170,
      drift: 0.2 + Math.random() * 0.45,
      ornament
    });
  }
  photoTreeReady = true;
}

function updatePhotoTreeTargets(time, exploded = false) {
  if (!photoTreeReady || photoTreeData.length !== particleCount) initPhotoTreeData();
  for (let i = 0; i < particleCount; i++) {
    const d = photoTreeData[i];
    const i3 = i * 3;
    if (exploded) {
      targetPositions[i3] = d.scatterX + Math.sin(time * d.drift + d.bob) * 5;
      targetPositions[i3+1] = d.scatterY + Math.cos(time * d.drift + d.angle) * 4;
      targetPositions[i3+2] = d.scatterZ + Math.sin(time * d.drift * 0.7 + d.angle) * 6;
    } else {
      const a = d.angle + time * d.spin;
      if (d.ornament === 'star') {
        // Top star - tight orbit
        const starR = 6 + Math.sin(i * 1.7) * 3;
        targetPositions[i3] = Math.cos(a * 2.8) * starR;
        targetPositions[i3+1] = d.y + Math.sin(i * 2.1) * 4;
        targetPositions[i3+2] = Math.sin(a * 2.8) * starR;
      } else if (d.ornament === 'halo') {
        // Star halo - wider orbit, slower
        const haloR = d.radius + Math.sin(time * 0.8 + i) * 2;
        targetPositions[i3] = Math.cos(a * 1.5) * haloR;
        targetPositions[i3+1] = d.y + Math.sin(time * 0.6 + i * 0.5) * 3;
        targetPositions[i3+2] = Math.sin(a * 1.5) * haloR;
      } else if (d.ornament === 'trunk') {
        // Trunk - fixed cylinder
        targetPositions[i3] = Math.cos(d.angle) * d.radius;
        targetPositions[i3+1] = d.y;
        targetPositions[i3+2] = Math.sin(d.angle) * d.radius;
      } else if (d.ornament && d.ornament.startsWith('gift')) {
        // Gift pile - gentle bob
        targetPositions[i3] = Math.cos(d.angle) * d.radius;
        targetPositions[i3+1] = d.y + Math.sin(time * 0.5 + d.bob) * 0.8;
        targetPositions[i3+2] = Math.sin(d.angle) * d.radius;
      } else if (d.ornament === 'ribbon') {
        const ribbonA = d.angle + time * d.spin + d.y * 0.065;
        targetPositions[i3] = Math.cos(ribbonA) * (d.radius + 2.5);
        targetPositions[i3+1] = d.y + Math.sin(d.y * 0.16) * 1.6;
        targetPositions[i3+2] = Math.sin(ribbonA) * (d.radius + 2.5);
      } else {
        // Tree body + decorations
        targetPositions[i3] = Math.cos(a) * d.radius;
        targetPositions[i3+1] = d.y + Math.sin(time * 1.4 + d.bob) * 1.4;
        targetPositions[i3+2] = Math.sin(a) * d.radius;
      }
    }
  }
}

function getDualHands() {
  if (handData.length < 2) {
    const only = handData[0];
    return { left: only, right: only };
  }
  let left = handData.find(h => h.label === 'Left');
  let right = handData.find(h => h.label === 'Right');
  if (!left || !right) {
    const sorted = [...handData].sort((a, b) => a.centerX - b.centerX);
    left = sorted[0];
    right = sorted[1];
  }
  return { left, right };
}

function updatePhotoTreeUI(time, leftHand, rightHand, displayActive, exploded = false) {
  if (!photoUrls.length || !displayActive) {
    photoNodes.forEach(node => node.classList.remove('visible'));
    ornamentNodes.forEach(node => node.classList.remove('visible'));
    featuredPhoto.classList.remove('visible');
    return;
  }

  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2 + 18;
  const scale = Math.min(window.innerWidth, window.innerHeight) / 310;
  const visibleCount = photoNodes.length;
  for (let i = 0; i < visibleCount; i++) {
    const node = photoNodes[i];
    let x, y, z, depth;
    if (exploded) {
      const a = i * 2.399963 + time * 0.08;
      const ring = Math.sqrt((i + 0.5) / Math.max(1, visibleCount));
      x = Math.cos(a) * ring * 145;
      y = Math.sin(a * 1.3) * ring * 96;
      z = Math.sin(a) * 90;
      depth = 0.72 + (z + 90) / 260;
    } else {
      const t = visibleCount <= 1 ? 0.5 : i / (visibleCount - 1);
      const level = Math.pow(t, 1.55);
      y = 82 - level * 168;
      const radius = 12 + level * 72;
      const a = (i / Math.max(1, visibleCount)) * Math.PI * 2 * 3 + time * 0.42;
      x = Math.cos(a) * radius;
      z = Math.sin(a) * radius;
      depth = 0.75 + (z + 75) / 220;
    }
    node.style.left = `${centerX + x * scale}px`;
    node.style.top = `${centerY - y * scale}px`;
    node.style.transform = `translate(-50%,-50%) scale(${Math.max(0.42, depth)})`;
    node.style.zIndex = String(12 + Math.round(depth * 10));
    node.classList.add('visible');
  }

  for (let i = 0; i < ornamentNodes.length; i++) {
    const node = ornamentNodes[i];
    const type = node.dataset.type;
    const level = parseFloat(node.dataset.level);
    const baseRadius = parseFloat(node.dataset.radius);
    const spin = parseFloat(node.dataset.spin);
    let x, y, z, depth, rot = 0;
    if (exploded) {
      const a = parseFloat(node.dataset.angle) + time * (0.12 + i * 0.0008);
      x = parseFloat(node.dataset.scatterX) + Math.cos(a) * 12;
      y = parseFloat(node.dataset.scatterY) + Math.sin(a * 1.17) * 9;
      z = parseFloat(node.dataset.scatterZ) + Math.sin(a) * 10;
      depth = 0.78 + (z + 100) / 290;
      rot = a * 38;
    } else {
      if (type === 'topstar') {
        y = 116;
        x = Math.sin(time * 0.9) * 1.5;
        z = 45;
        depth = 1.18;
        rot = Math.sin(time * 0.8) * 7;
      } else if (type === 'gift') {
        y = -94 + (level - 0.9) * 22;
        const a = parseFloat(node.dataset.angle) + Math.sin(time * 0.35 + i) * 0.08;
        x = Math.cos(a) * baseRadius;
        z = Math.sin(a) * baseRadius + 40;
        depth = 0.9 + (z + 70) / 260;
        rot = Math.sin(a) * 7;
      } else {
        y = 92 - level * 188;
        const a = parseFloat(node.dataset.angle) + time * spin + (type === 'ribbon' ? y * 0.07 : 0);
        x = Math.cos(a) * baseRadius;
        z = Math.sin(a) * baseRadius;
        depth = 0.72 + (z + 90) / 240;
        rot = type === 'ribbon' ? -18 + Math.sin(a) * 24 : Math.sin(a) * 10;
      }
    }
    const s = parseFloat(node.dataset.scale) * Math.max(0.64, depth);
    node.style.left = `${centerX + x * scale}px`;
    node.style.top = `${centerY - y * scale}px`;
    node.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(${s})`;
    node.style.zIndex = String(24 + Math.round(depth * 18));
    node.classList.add('visible');
  }

  const leftOpen = leftHand && leftHand.fingers >= 4 && !leftHand.isFist;
  if (leftOpen) {
    if (!featuredPhoto.classList.contains('visible')) {
      setFeaturedPhoto(Math.floor(Math.random() * photoUrls.length));
    }
    featuredPhoto.classList.add('visible');
    const now = performance.now();
    if (lastWaveX !== null && now - lastWaveAt > 520) {
      const dx = leftHand.centerX - lastWaveX;
      if (Math.abs(dx) > 0.13) {
        setFeaturedPhoto(activePhotoIndex + (dx > 0 ? 1 : -1));
        lastWaveAt = now;
      }
    }
    lastWaveX = leftHand.centerX;
  } else {
    featuredPhoto.classList.remove('visible');
    lastWaveX = leftHand ? leftHand.centerX : null;
  }
}

  }

// ==================== MEDIAPIPE HANDS ====================
let handSmoothed = [null, null];
let handData = [];
// per-hand fingers history for smoothing (index 0 and 1)
let fingersHistory = [[], []];
const FINGERS_HIST_MS = 400;
let pendingKey = '', pendingFrames = 0;
let lastShapedMode = '';

function smoothHand(lms, idx) {
  if(!handSmoothed[idx]) { handSmoothed[idx]=lms.map(l=>({x:l.x,y:l.y,z:l.z})); return handSmoothed[idx]; }
  const s=handSmoothed[idx];
  for(let i=0;i<lms.length;i++){s[i].x+=(lms[i].x-s[i].x)*.35;s[i].y+=(lms[i].y-s[i].y)*.35;s[i].z+=(lms[i].z-s[i].z)*.35;}
  return s;
}

function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angleAt(a,b,c){
  const abx=a.x-b.x, aby=a.y-b.y, cbx=c.x-b.x, cby=c.y-b.y;
  const denom=Math.max(1e-6, Math.hypot(abx,aby)*Math.hypot(cbx,cby));
  return Math.acos(Math.max(-1, Math.min(1, (abx*cbx+aby*cby)/denom)));
}

function countFingers(lms) {
  let count = 0;
  const wrist = lms[0];
  const ps = Math.max(.001, dist2(lms[0], lms[9]));
  const minDiff = Math.max(ps * 0.08, 0.018);

  // Count fingers by shape, not screen tilt. This stays stable when the hand rotates.
  for (const [tip, pip, mcp] of [[8, 6, 5], [12, 10, 9], [16, 14, 13], [20, 18, 17]]) {
    const tipDist = dist2(lms[tip], wrist);
    const pipDist = dist2(lms[pip], wrist);
    const mcpDist = dist2(lms[mcp], wrist);
    const straight = angleAt(lms[tip], lms[pip], lms[mcp]) > 2.35;
    if (straight && tipDist > pipDist + minDiff && pipDist > mcpDist - minDiff) {
      count++;
    }
  }

  const thumbTip = lms[4];
  const thumbIp = lms[3];
  const thumbMcp = lms[2];
  const indexBase = lms[5];
  const thumbDist = dist2(thumbTip, wrist);
  const thumbIpDist = dist2(thumbIp, wrist);
  const thumbStraight = angleAt(thumbTip, thumbIp, thumbMcp) > 2.1;
  const thumbExtended = thumbStraight && thumbDist > thumbIpDist + minDiff * 0.7;
  const thumbSeparated = dist2(thumbTip, indexBase) > ps * 0.34;
  if (thumbExtended && thumbSeparated) count++;
  return count;
}

function getSmoothedFingers(raw, handIndex = 0) {
  const now = performance.now();
  const hist = fingersHistory[handIndex] || (fingersHistory[handIndex] = []);
  hist.push({ v: raw, t: now });
  while (hist.length && now - hist[0].t > FINGERS_HIST_MS) hist.shift();
  const counts = {}; let mx = 0, mode = raw;
  for (const h of hist) {
    counts[h.v] = (counts[h.v] || 0) + 1;
    if (counts[h.v] > mx) { mx = counts[h.v]; mode = h.v; }
  }
  const strongMajority = mx >= Math.ceil(hist.length * 0.65);
  if (!strongMajority && handData[handIndex] && typeof handData[handIndex].fingers === 'number') {
    return handData[handIndex].fingers;
  }
  return mode;
}

function detectFist(lms) {
  const ps=Math.max(.001,dist2(lms[0],lms[9]));
  const px=(lms[0].x+lms[9].x)/2,py=(lms[0].y+lms[9].y)/2,ps2=ps*1.05;
  for(let i=8;i<=20;i+=4) if(Math.hypot(lms[i].x-px,lms[i].y-py)>ps2) return false;
  return true;
}

function stabilizeGesture(nextMode, nextFingers) {
  const key = `${nextMode}:${nextFingers}`;
  if (key === pendingKey) pendingFrames++; else { pendingKey = key; pendingFrames = 1; }
  const needed = nextMode === 'idle' ? 4 : 4;
  if (pendingFrames >= needed || (gestureMode === 'idle' && nextMode !== 'idle' && pendingFrames >= 2)) {
    gestureMode = nextMode; currentFingers = nextFingers;
  }
}

function drawHands2D() {

    const col=isF?'rgba(255,180,100,':'rgba(100,200,255,';
    handCtx.strokeStyle=col+'0.3)'; handCtx.lineWidth=1.5;
    const W=handCanvas.width, H=handCanvas.height;
    for(const [a,b] of HAND_CONNS) {
      handCtx.beginPath();
      handCtx.moveTo(lms[a].x*W,lms[a].y*H);
      handCtx.lineTo(lms[b].x*W,lms[b].y*H);
      handCtx.stroke();
    }
    for(const l of lms) {
      handCtx.beginPath(); handCtx.arc(l.x*W,l.y*H,3,0,Math.PI*2);
      handCtx.fillStyle=col+'0.6)'; handCtx.fill();
    }

// ==================== ANIMATION LOOP ====================
const clock = new THREE.Clock();

function animate(now = 0) {
  requestAnimationFrame(animate);
  if (TARGET_FRAME_MS && now - lastRenderAt < TARGET_FRAME_MS) return;
  lastRenderAt = now;
  const elapsed = clock.getElapsedTime();

  if (material) material.uniforms.uTime.value = elapsed;

  // Determine gesture mode
  if (handData.length >= 2 || (IS_MOBILE && photoUrls.length && handData.length === 1)) {
    stabilizeGesture('hands', -1);
  } else if (handData.length === 1) {
    const hd = handData[0];
    const ef = hd.isFist && hd.fingers <= 1;
    if (ef) stabilizeGesture('fist', 0);
    else if (hd.fingers === 5) stabilizeGesture('love', 5);
    else stabilizeGesture('idle', -1);
  } else {
    stabilizeGesture('idle', -1);
  }

  // Shape updates
  const modeChanged = gestureMode !== lastShapedMode;

  if (modeChanged) {
    switch(gestureMode) {
      case 'idle':
        hidePhotoUpload();
        hidePhotoTreeUI();
        setModelShape(manualModel);
        controls.autoRotate = true;
        break;
      case 'love':
        hidePhotoUpload();
        hidePhotoTreeUI();
        resetFrontView();
        genLove(particleCount);
        launchBalloons();
        controls.autoRotate = false;
        break;
      case 'fist':
        hidePhotoUpload();
        hidePhotoTreeUI();
        initFistData();
        controls.autoRotate = false;
        break;
      case 'hands':
        resetFrontView(240);
        showPhotoUpload();
        if (photoUrls.length) {
          initPhotoTreeData();
          updatePhotoTreeColors();
          startTransition();
        }
        controls.autoRotate = false;
        break;
    }
    lastShapedMode = gestureMode;
  }

  // Per-frame updates
  if (gestureMode === 'fist' && handData.length === 1) {
    const hd = handData[0];
    fistCX += (hd.centerX * 200 - 100 - fistCX) * 0.1;
    fistCY += (-(hd.centerY * 200 - 100) - fistCY) * 0.1;
    updateFistTargets(fistCX, fistCY, elapsed);
  }

  if (gestureMode === 'hands' && handData.length >= 1) {
    const { left, right } = getDualHands();
    if (!photoUrls.length) {
      showPhotoUpload();
      hidePhotoTreeUI();
      genDualHand(handData[0].landmarks, handData[1].landmarks, particleCount);
    } else {
      hidePhotoUpload();
      const treeActive = right && right.isFist;
      const exploded = right && right.fingers >= 4 && !right.isFist;
      const displayActive = treeActive || exploded;
      const nextPhotoMode = treeActive ? 'tree' : exploded ? 'exploded' : 'hands';
      if (nextPhotoMode !== photoDisplayMode) {
        photoDisplayMode = nextPhotoMode;
        if (displayActive) {
          updatePhotoTreeColors();
          startTransition();
          setSnowVisible(true);
        } else {
          updateColors();
          setSnowVisible(false);
        }
      }
      if (displayActive) updatePhotoTreeTargets(elapsed, exploded);
      else genDualHand(handData[0].landmarks, handData[1].landmarks, particleCount);
      updatePhotoTreeUI(elapsed, left, right, displayActive, exploded);
    }
  }

  // Lerp positions
  if (geometry) {
    const posArr = geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      animProgress[i] = Math.min(1, animProgress[i] + 0.018);
      const ease = 1 - Math.pow(1 - Math.max(0, animProgress[i]), 3);
      const ls = 0.045 * ease;
      const i3 = i*3;
      posArr[i3]   += (targetPositions[i3]   - posArr[i3])   * ls;
      posArr[i3+1] += (targetPositions[i3+1] - posArr[i3+1]) * ls;
      posArr[i3+2] += (targetPositions[i3+2] - posArr[i3+2]) * ls;
    }
    geometry.attributes.position.needsUpdate = true;
  }

  updateSnowCanvas();
  updateHud();
  controls.update();
  renderer.render(scene, camera);
}

// ==================== MEDIAPIPE INIT ====================
async function initHandTracking() {
  if (typeof Hands === 'undefined') {
    console.warn('MediaPipe Hands not loaded');
    return;
  }
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: PERF.modelComplexity, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  hands.onResults(results => {
    handData = [];
    if (results.multiHandLandmarks) {
      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const raw = results.multiHandLandmarks[i];
        const lms = smoothHand(raw, i);
        const rawF = countFingers(lms);
        const fingers = getSmoothedFingers(rawF, i);
        const isFist = detectFist(lms);
        const label = results.multiHandedness && results.multiHandedness[i] ? results.multiHandedness[i].label : '';
        handData.push({ landmarks: lms, fingers, isFist, centerX: lms[0].x, centerY: lms[0].y, label });
      }
    }
    if (handData.length===0) {
      handSmoothed = [null, null];
      fingersHistory = [[], []];
    } else if (handData.length===1) {
      handSmoothed = [handSmoothed[0], null];
      fingersHistory[1] = [];
    }
    drawHands2D();
  });

  loadingOverlay.classList.remove('hidden');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{width:{ideal:PERF.cameraWidth},height:{ideal:PERF.cameraHeight},facingMode:'user'}});
    video.srcObject = stream;
    await video.play();
    const cam = new Camera(video, {
      onFrame: async () => {
        const now = performance.now();
        if (now - lastHandSend < HAND_TRACK_INTERVAL) return;
        lastHandSend = now;
        await hands.send({image:video});
      },
      width: PERF.cameraWidth,
      height: PERF.cameraHeight
    });
    cam.start();
    loadingOverlay.classList.add('hidden');
  } catch(err) {
    console.warn('Camera failed:', err);
    loadingOverlay.classList.add('hidden');
  }
}

colorPicker.addEventListener('input', e => setColor(e.target.value));
colorHex.addEventListener('change', e => { if(/^#[0-9a-fA-F]{6}$/.test(e.target.value)) setColor(e.target.value); });

modelGrid.addEventListener('click', e => {
  const btn = e.target.closest('.model-btn');
  if(!btn) return;
  modelGrid.querySelectorAll('.model-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  manualModel = btn.dataset.model;
  if (gestureMode === 'idle') setModelShape(manualModel);
});

countSlider.addEventListener('input', e => {
  const v=parseInt(e.target.value);
  countVal.textContent = v>=1000?(v/1000)+'k':v;
  initParticles(v);
  initFistData();
});

sizeSlider.addEventListener('input', e => {
  pointSize=parseFloat(e.target.value);
  sizeVal.textContent=pointSize;
  if(geometry){const s=geometry.attributes.size.array;for(let i=0;i<particleCount;i++)s[i]=pointSize*(0.4+Math.random()*0.6);geometry.attributes.size.needsUpdate=true;}
});

document.getElementById('btnFS').addEventListener('click', () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

document.getElementById('togglePanel').addEventListener('click', () => panel.classList.toggle('collapsed'));

window.addEventListener('resize', () => {
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, PERF.pixelRatio));
  resizeHandCanvas();
  resizeSnowCanvas();
  if(material) material.uniforms.uPixelRatio.value=renderer.getPixelRatio();
});

// ==================== START ====================
startBtn.addEventListener('click', async () => {
  startOverlay.classList.add('hidden');
  showPhotoUpload();
  await initHandTracking();
}, {once:true});

initParticles(particleCount);
initSnowCanvas();
animate();
</script>
</body>
</html>
