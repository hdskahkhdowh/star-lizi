<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手势星空粒子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block;position:fixed;inset:0;z-index:1}
video{display:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,#0a0a2e 0%,#000 70%);color:#ffd700;font-size:20px;transition:opacity .8s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid rgba(255,215,0,.2);border-top-color:#ffd700;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#debug{position:fixed;bottom:10px;left:10px;z-index:20;color:#0f0;font:12px monospace;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:4px;pointer-events:none}
#startOverlay{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,10,46,.72) 0%,rgba(0,0,0,.9) 70%)}
#startOverlay.hidden{opacity:0;pointer-events:none;transition:opacity .35s}
#startBtn{border:1px solid rgba(255,215,0,.75);background:rgba(0,0,0,.72);color:#ffd700;font:700 20px "Segoe UI",sans-serif;padding:14px 28px;border-radius:8px;box-shadow:0 0 22px rgba(255,215,0,.25)}
</style>
</head>
<body>
<div id="loading" class="hidden"><div class="spinner"></div>正在加载手势识别模型...</div>
<div id="debug"></div>
<div id="startOverlay"><button id="startBtn" type="button">开始识别</button></div>
<video id="video" autoplay muted playsinline webkit-playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const debugEl = document.getElementById('debug');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function log(msg) { console.log('[Star]', msg); debugEl.textContent = msg; }

// ==================== LOVE 文字采样 ====================
function generateLovePoints(count) {
  const tmp = document.createElement('canvas');
  const tctx = tmp.getContext('2d');
  const fontSize = Math.min(W * 0.55, 360);
  tmp.width = W; tmp.height = H;
  tctx.fillStyle = '#fff';
  tctx.font = `900 ${fontSize}px "Arial Black","Impact",sans-serif`;
  tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
  tctx.fillText('LOVE', W/2, H/2);
  const imgData = tctx.getImageData(0,0,W,H).data;
  const filled = [];
  for (let y = 0; y < H; y += 4)
    for (let x = 0; x < W; x += 4)
      if (imgData[(y*W+x)*4+3] > 128) filled.push([x/W, y/H]);
  if (!filled.length) return Array.from({length:count}, ()=>[0.5,0.5]);
  const pts = [];
  for (let i = 0; i < count; i++) {
    const p = filled[Math.floor(i * filled.length / count) % filled.length];
    pts.push(p);
  }
  return pts;
}

// ==================== 手部骨架均匀采样 ====================
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

function generateHandPoints(lms, count) {
  const segs = [];
  let totalLen = 0;
  for (const [a, b] of HAND_CONNECTIONS) {
    const l = Math.hypot(lms[b].x - lms[a].x, lms[b].y - lms[a].y);
    segs.push({a, b, l}); totalLen += l;
  }
  const spacing = totalLen / count;
  const points = [];
  let dist = spacing * 0.5;
  for (const seg of segs) {
    let d = dist;
    while (d <= seg.l && points.length < count) {
      const t = d / seg.l;
      points.push([
        lms[seg.a].x + (lms[seg.b].x - lms[seg.a].x) * t,
        lms[seg.a].y + (lms[seg.b].y - lms[seg.a].y) * t
      ]);
      d += spacing;
    }
    dist = d - seg.l;
  }
  while (points.length < count) points.push(points[points.length-1] || [lms[0].x, lms[0].y]);
  return points;
}

// ==================== 数字形状 ====================
const SHAPES = {};
SHAPES[0] = [[.35,.15,.65,.15],[.65,.15,.75,.3],[.75,.3,.75,.7],[.75,.7,.65,.85],[.65,.85,.35,.85],[.35,.85,.25,.7],[.25,.7,.25,.3],[.25,.3,.35,.15]];
SHAPES[1] = [[.5,.1,.5,.9],[.35,.2,.5,.1]];
SHAPES[2] = [[.25,.2,.4,.1],[.4,.1,.65,.1],[.65,.1,.8,.25],[.8,.25,.65,.45],[.65,.45,.25,.7],[.25,.7,.25,.9],[.25,.9,.8,.9]];
SHAPES[3] = [[.2,.1,.75,.1],[.75,.1,.85,.25],[.85,.25,.7,.45],[.7,.45,.55,.5],[.55,.5,.75,.55],[.75,.55,.85,.7],[.85,.7,.75,.9],[.75,.9,.2,.9]];
SHAPES[4] = [[.6,.1,.2,.65],[.2,.65,.8,.65],[.75,.1,.75,.9]];
SHAPES[5] = [[.75,.1,.25,.1],[.25,.1,.2,.35],[.2,.35,.65,.35],[.65,.35,.8,.5],[.8,.5,.7,.75],[.7,.75,.35,.85],[.35,.85,.2,.9],[.2,.9,.8,.9]];

function generateLinePoints(segs, count) {
  let totalLen = 0;
  const lens = segs.map(s => { const l = Math.hypot(s[2]-s[0],s[3]-s[1]); totalLen += l; return l; });
  const spacing = totalLen / count;
  const pts = [];
  let dist = spacing * 0.5;
  for (let i = 0; i < segs.length && pts.length < count; i++) {
    const s = segs[i], l = lens[i];
    let d = dist;
    while (d <= l && pts.length < count) {
      const t = d / l;
      pts.push([s[0]+(s[2]-s[0])*t, s[1]+(s[3]-s[1])*t]);
      d += spacing;
    }
    dist = d - l;
  }
  while (pts.length < count) pts.push(pts[pts.length-1]||[.5,.5]);
  return pts;
}

// ==================== 颜色工具 ====================
const NEON_COLORS = [
  [255,0,128],[255,0,255],[128,0,255],[0,128,255],
  [0,255,255],[0,255,128],[128,255,0],[255,255,0],
  [255,128,0],[255,64,64],[255,100,200],[100,200,255],
  [180,100,255],[255,200,50],[50,255,200],[255,80,180]
];

function hslToRgb(h, s, l) {
  h=((h%360)+360)%360; s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}

// ==================== 性能配置 ====================
const IS_TOUCH = (navigator.maxTouchPoints || 0) > 0 || matchMedia('(pointer: coarse)').matches;
const SHORT_SIDE = Math.min(window.innerWidth, window.innerHeight);
const IS_PHONE = IS_TOUCH && SHORT_SIDE < 700;
const PERF = IS_PHONE ? {
  label:'mobile', particleCount:360, bgStarCount:120, maxSparkles:24,
  handFps:14, modelComplexity:0, cameraWidth:424, cameraHeight:320,
  trail:false, glowRadius:4.2, sparkleChance:0.16
} : IS_TOUCH ? {
  label:'tablet', particleCount:520, bgStarCount:180, maxSparkles:36,
  handFps:18, modelComplexity:0, cameraWidth:480, cameraHeight:360,
  trail:true, glowRadius:4.8, sparkleChance:0.22
} : {
  label:'desktop', particleCount:800, bgStarCount:300, maxSparkles:60,
  handFps:30, modelComplexity:1, cameraWidth:640, cameraHeight:480,
  trail:true, glowRadius:6, sparkleChance:0.3
};

// ==================== 粒子系统 ====================
const PARTICLE_COUNT = PERF.particleCount;
const LERP_SPEED = 0.065;

class Particle {
  constructor(i) {
    this.x = Math.random()*W; this.y = Math.random()*H;
    this.tx = this.x; this.ty = this.y;
    this.size = 0.6 + Math.random()*2.8;
    this.brightness = 0.5 + Math.random()*0.5;
    this.twinkleSpeed = 1.5 + Math.random()*4;
    this.twinklePhase = Math.random()*Math.PI*2;
    this.driftX = (Math.random()-.5)*0.4;
    this.driftY = (Math.random()-.5)*0.4;
    this.angle = Math.random()*Math.PI*2;
    this.orbitSpeed = 0.001 + Math.random()*0.003;
    this.orbitRadius = 20 + Math.random()*60;
    this.fistAngle = Math.random()*Math.PI*2;
    this.fistOrbitR = 30 + Math.random()*140;
    this.fistOrbitSpeed = 0.006 + Math.random()*0.022;
    this.fistBob = Math.random()*Math.PI*2;
    this.fistBobSpeed = 0.015 + Math.random()*0.03;
    this.fistBobAmp = 10 + Math.random()*50;
    this.baseColor = NEON_COLORS[i % NEON_COLORS.length];
    this.color = [...this.baseColor];
    this.lovePhase = Math.random()*Math.PI*2;
    this.loveShimmer = 2 + Math.random()*4;
    this.prevX = this.x; this.prevY = this.y;
    this.currentSize = this.size;
    this.currentBrightness = this.brightness;
  }
  setTarget(nx, ny) { this.tx = nx*W; this.ty = ny*H; }
  idleUpdate(time) {
    this.angle += this.orbitSpeed;
    this.tx += Math.cos(this.angle)*this.orbitRadius*0.01 + this.driftX;
    this.ty += Math.sin(this.angle)*this.orbitRadius*0.01 + this.driftY;
    if(this.tx<50)this.tx=50; if(this.tx>W-50)this.tx=W-50;
    if(this.ty<50)this.ty=50; if(this.ty>H-50)this.ty=H-50;
    this.color = [...this.baseColor];
  }
  fistUpdate(time, cx, cy) {
    this.fistAngle += this.fistOrbitSpeed;
    this.fistBob += this.fistBobSpeed;
    this.tx = cx + Math.cos(this.fistAngle)*this.fistOrbitR;
    this.ty = cy + Math.sin(this.fistAngle)*this.fistOrbitR + Math.sin(this.fistBob)*this.fistBobAmp;
    this.color = [...this.baseColor];
  }
  loveUpdate(time, phase) {
    const hue = (this.tx/W*360 + time*80 + phase) % 360;
    this.color = hslToRgb(hue, 100, 60);
    this.currentSize = this.size * (1 + Math.sin(time*3+this.lovePhase)*0.3);
    this.currentBrightness = this.brightness * (0.75 + 0.25*Math.sin(time*this.loveShimmer+this.lovePhase));
  }
  handsUpdate(time) {
    // 彩虹色流光
    const hue = (this.tx/W*360 + this.ty/H*120 + time*60) % 360;
    this.color = hslToRgb(hue, 100, 60);
    const shimmer = Math.sin(time*3 + this.lovePhase);
    this.currentBrightness = this.brightness * (0.7 + 0.3*shimmer);
    this.currentSize = this.size * (0.9 + 0.1*shimmer);
  }
  numberUpdate(time) {
    const hue = (this.baseColor[0]>200?45:this.baseColor[1]>200?180:280) + Math.sin(time*0.5+this.lovePhase)*20;
    this.color = hslToRgb(hue, 90, 55);
  }
  update(time) {
    this.prevX = this.x; this.prevY = this.y;
    this.x += (this.tx - this.x) * LERP_SPEED;
    this.y += (this.ty - this.y) * LERP_SPEED;
    const tw = Math.sin(time*this.twinkleSpeed+this.twinklePhase);
    if(!this._loveMode) {
      this.currentBrightness = this.brightness*(0.7+0.3*tw);
      this.currentSize = this.size*(0.85+0.15*tw);
    }
  }
  draw(enhanced) {
    const [r,g,b] = this.color;
    const a = this.currentBrightness, s = this.currentSize;
    if(enhanced && PERF.trail) {
      ctx.beginPath(); ctx.moveTo(this.prevX,this.prevY); ctx.lineTo(this.x,this.y);
      ctx.strokeStyle=`rgba(${r},${g},${b},${a*0.25})`; ctx.lineWidth=s*0.8; ctx.stroke();
    }
    const gm = enhanced?PERF.glowRadius:4;
    ctx.beginPath(); ctx.arc(this.x,this.y,s*gm,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${a*(enhanced?0.12:0.08)})`; ctx.fill();
    ctx.beginPath(); ctx.arc(this.x,this.y,s*2.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${a*0.25})`; ctx.fill();
    ctx.beginPath(); ctx.arc(this.x,this.y,s,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${a})`; ctx.fill();
    ctx.beginPath(); ctx.arc(this.x,this.y,s*0.4,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a*0.85})`; ctx.fill();
    if(s>1.2) {
      ctx.strokeStyle=`rgba(255,255,255,${a*(enhanced?0.5:0.3)})`;
      ctx.lineWidth=enhanced?0.8:0.5;
      const len=s*(enhanced?3.5:2.5);
      ctx.beginPath();
      ctx.moveTo(this.x-len,this.y); ctx.lineTo(this.x+len,this.y);
      ctx.moveTo(this.x,this.y-len); ctx.lineTo(this.x,this.y+len);
      ctx.stroke();
    }
    if(enhanced && PERF.trail && s>1.8) {
      const sp=Math.sin(Date.now()*0.005+this.lovePhase*3);
      if(sp>0.7) {
        ctx.beginPath(); ctx.arc(this.x,this.y,s*3,0,Math.PI*2);
        ctx.strokeStyle=`rgba(255,255,255,${sp*0.3})`; ctx.lineWidth=0.6; ctx.stroke();
      }
    }
  }
}

const particles = Array.from({length:PARTICLE_COUNT}, (_,i)=>new Particle(i));

function setShape(key) {
  const pts = generateLinePoints(SHAPES[key], PARTICLE_COUNT);
  particles.forEach((p,i)=>p.setTarget(pts[i][0], pts[i][1]));
}
function setLoveShape() {
  const pts = generateLovePoints(PARTICLE_COUNT);
  particles.forEach((p,i)=>p.setTarget(pts[i][0], pts[i][1]));
}
function setHandShape(allPoints) {
  particles.forEach((p,i)=>{
    if(i < allPoints.length) p.setTarget(allPoints[i][0], allPoints[i][1]);
  });
}

// ==================== 火花特效 ====================
const sparkles = [];
function emitSparkles(time) {
  if(sparkles.length>PERF.maxSparkles) return;
  const p = particles[Math.floor(Math.random()*particles.length)];
  if(Math.random()<PERF.sparkleChance) {
    sparkles.push({
      x:p.x, y:p.y, vx:(Math.random()-.5)*3, vy:-1-Math.random()*3,
      life:1, decay:0.015+Math.random()*0.02, size:1+Math.random()*2, color:p.color
    });
  }
}
function updateSparkles() {
  for(let i=sparkles.length-1;i>=0;i--) {
    const s=sparkles[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.02; s.life-=s.decay;
    if(s.life<=0){sparkles.splice(i,1);continue;}
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size*s.life,0,Math.PI*2);
    ctx.fillStyle=`rgba(${s.color[0]},${s.color[1]},${s.color[2]},${s.life*0.8})`; ctx.fill();
  }
}

// ==================== 背景星空 ====================
const bgStars = Array.from({length:PERF.bgStarCount}, ()=>({
  x:Math.random(),y:Math.random(),s:0.3+Math.random()*1.5,b:0.3+Math.random()*0.7,sp:1+Math.random()*3
}));
function drawBgStars(time) {
  for(const st of bgStars) {
    const a=st.b*(0.6+0.4*Math.sin(time*st.sp));
    const [r,g,b]=hslToRgb((time*10+st.x*360)%360,40,85);
    ctx.fillStyle=`rgba(${r},${g},${b},${a})`;
    ctx.fillRect(st.x*W,st.y*H,st.s,st.s);
  }
}

// ==================== LOVE 背景光晕 ====================
function drawLoveGlow(time) {
  const pulse=0.3+0.2*Math.sin(time*2);
  const [r,g,b]=hslToRgb((time*30)%360,80,50);
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.5);
  grad.addColorStop(0,`rgba(${r},${g},${b},${pulse*0.15})`);
  grad.addColorStop(0.5,`rgba(${r},${g},${b},${pulse*0.05})`);
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
}

// ==================== 双手光晕 ====================
function drawHandsGlow(time, cx1, cy1, cx2, cy2) {
  const pulse=0.25+0.15*Math.sin(time*2.5);
  for(const [cx,cy] of [[cx1,cy1],[cx2,cy2]]) {
    const hue=(time*40+cx/W*180)%360;
    const [r,g,b]=hslToRgb(hue,80,50);
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,200);
    grad.addColorStop(0,`rgba(${r},${g},${b},${pulse*0.2})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad; ctx.fillRect(cx-200,cy-200,400,400);
  }
}

// ==================== 手势状态 ====================
const MAX_HANDS = 2;
let handSmoothed = [null, null];
let handData = [];        // [{landmarks, fingers, isFist, centerX, centerY}, ...]
let gestureMode = 'idle'; // idle | number | love | fist | hands
let currentFingers = -1;
let pendingGestureKey = '';
let pendingGestureFrames = 0;
let lastShapedMode = '';
let lastShapedFingers = -1;

// 平滑单只手
function smoothHand(lms, idx) {
  if(!handSmoothed[idx]) { handSmoothed[idx]=lms.map(l=>({x:l.x,y:l.y,z:l.z})); return handSmoothed[idx]; }
  const s=handSmoothed[idx];
  for(let i=0;i<lms.length;i++) {
    s[i].x+=(lms[i].x-s[i].x)*0.35;
    s[i].y+=(lms[i].y-s[i].y)*0.35;
    s[i].z+=(lms[i].z-s[i].z)*0.35;
  }
  return s;
}

function dist(a, b) {
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function countFingers(lms) {
  let c = 0;
  const wrist = lms[0];
  const palmScale = Math.max(0.001, dist(lms[0], lms[9]));
  const margin = palmScale * 0.15;
  let openLongFingers = 0;

  // 四指：tip 距手腕 > pip 距手腕 + margin，且 tip 未折叠到 mcp 附近
  const fourFingers = [[8,6,5],[12,10,9],[16,14,13],[20,18,17]];
  for(const [tip, pip, mcp] of fourFingers) {
    const tipDist = dist(lms[tip], wrist);
    const pipDist = dist(lms[pip], wrist);
    const folded = dist(lms[tip], lms[mcp]) < palmScale * 0.55;
    if(tipDist > pipDist + margin && !folded) {
      c++;
      openLongFingers++;
    }
  }

  // 拇指：手机/平板上手掌角度变化大，不能只看横向或“比指节更远”。
  // 张开五指时，拇指通常会远离掌心、远离食指根部，并相对拇指根部向侧边打开。
  const thumbTip = lms[4];
  const thumbIp = lms[3];
  const thumbMcp = lms[2];
  const palmCenter = {x:(lms[0].x+lms[5].x+lms[9].x+lms[13].x+lms[17].x)/5, y:(lms[0].y+lms[5].y+lms[9].y+lms[13].y+lms[17].y)/5};
  const thumbExtended = dist(thumbTip, wrist) > dist(thumbIp, wrist) + palmScale * 0.04 || dist(thumbTip, thumbMcp) > palmScale * 0.48;
  const thumbSideOpen = Math.abs(thumbTip.x - thumbMcp.x) > palmScale * 0.12 || dist(thumbTip, lms[5]) > dist(thumbMcp, lms[5]) + palmScale * 0.03;
  const thumbAwayFromPalm = dist(thumbTip, palmCenter) > palmScale * (openLongFingers === 4 ? 0.58 : 0.68);
  const thumbNotTucked = dist(thumbTip, lms[6]) > palmScale * 0.34 && dist(thumbTip, lms[10]) > palmScale * 0.42;
  if(thumbExtended && thumbSideOpen && thumbAwayFromPalm && thumbNotTucked) c++;

  return c;
}

// =============== 时间投票平滑 ===============
const fingersHistory = [];
const FINGERS_HISTORY_MS = 250;

function getSmoothedFingers(raw) {
  const now = performance.now();
  fingersHistory.push({v: raw, t: now});
  while(fingersHistory.length > 0 && now - fingersHistory[0].t > FINGERS_HISTORY_MS)
    fingersHistory.shift();

  if(fingersHistory.length === 0) return raw;

  // 投票：取众数
  const counts = {};
  let maxCount = 0, mode = raw;
  for(const h of fingersHistory) {
    counts[h.v] = (counts[h.v] || 0) + 1;
    if(counts[h.v] > maxCount) { maxCount = counts[h.v]; mode = h.v; }
  }
  return mode;
}

function detectFist(lms) {
  const palmScale = Math.max(0.001, dist(lms[0], lms[9]));
  const px=(lms[0].x+lms[9].x)/2, py=(lms[0].y+lms[9].y)/2;
  const ps=palmScale*1.05;
  for(let i=8;i<=20;i+=4) if(Math.hypot(lms[i].x-px,lms[i].y-py)>ps) return false;
  return true;
}

function stabilizeGesture(nextMode, nextFingers) {
  const key = `${nextMode}:${nextFingers}`;
  if(key === pendingGestureKey) pendingGestureFrames++;
  else {
    pendingGestureKey = key;
    pendingGestureFrames = 1;
  }
  // 时间投票已平滑手指计数，这里只防模式跳变
  const needed = nextMode === 'idle' ? 4 : 2;
  if(pendingGestureFrames >= needed || (gestureMode === 'idle' && nextMode !== 'idle')) {
    gestureMode = nextMode;
    currentFingers = nextFingers;
  }
}

// ==================== 手部绘制 ====================
function drawAllHands() {
  for(const hd of handData) {
    const lms=hd.landmarks, isF=hd.isFist;
    const c1=isF?'rgba(255,180,100,':'rgba(100,200,255,';
    ctx.strokeStyle=c1+'0.4)'; ctx.lineWidth=2;
    for(const [a,b] of HAND_CONNECTIONS) {
      ctx.beginPath();
      ctx.moveTo(lms[a].x*W,lms[a].y*H);
      ctx.lineTo(lms[b].x*W,lms[b].y*H);
      ctx.stroke();
    }
    for(const l of lms) {
      const x=l.x*W,y=l.y*H;
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=c1+'0.7)';ctx.fill();
      ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fillStyle=c1+'0.15)';ctx.fill();
    }
  }
}

// ==================== UI 文字 ====================
function drawText() {
  ctx.textAlign='center'; ctx.textBaseline='top';
  if(gestureMode==='idle') {
    ctx.font='600 24px "Segoe UI",sans-serif';
    const p=0.6+0.4*Math.sin(Date.now()*0.003);
    ctx.fillStyle=`rgba(255,215,0,${p})`;
    ctx.fillText('请伸出手掌，对准摄像头',W/2,30);
    ctx.font='16px "Segoe UI",sans-serif';
    ctx.fillStyle='rgba(200,200,255,0.5)';
    ctx.fillText('1-4 指=数字 | 五指张开=LOVE | 握拳=跟随 | 双手=模仿手势',W/2,64);
  } else if(gestureMode==='hands') {
    ctx.font='bold 32px "Segoe UI",sans-serif';
    const hue=(Date.now()*0.06)%360;
    ctx.fillStyle=`hsl(${hue},100%,65%)`;
    ctx.fillText('双手模式 - 粒子模仿手势',W/2,30);
    const f1=handData[0]?handData[0].fingers:'?';
    const f2=handData.length>1?handData[1].fingers:'?';
    ctx.font='16px "Segoe UI",sans-serif';
    ctx.fillStyle='rgba(200,200,255,0.5)';
    ctx.fillText(`左手: ${f1}指  右手: ${f2}指`,W/2,68);
  } else if(gestureMode==='fist') {
    ctx.font='bold 30px "Segoe UI",sans-serif';
    ctx.fillStyle='rgba(255,180,100,0.9)';
    ctx.fillText('拳头模式',W/2,30);
  } else if(gestureMode==='love') {
    ctx.font='bold 32px "Segoe UI",sans-serif';
    ctx.fillStyle=`hsl(${(Date.now()*0.06)%360},100%,65%)`;
    ctx.fillText('LOVE 模式',W/2,30);
  } else {
    ctx.font='bold 28px "Segoe UI",sans-serif';
    ctx.fillStyle='rgba(255,215,0,0.9)';
    ctx.fillText(`数字 ${currentFingers}`,W/2,30);
    ctx.font='14px "Segoe UI",sans-serif';
    ctx.fillStyle='rgba(200,200,255,0.4)';
    ctx.fillText(`检测到 ${currentFingers} 根手指`,W/2,64);
  }
}

// ==================== 主循环 ====================
let startTime=performance.now();
let lovePhase=0;

function animate() {
  const time=(performance.now()-startTime)/1000;
  lovePhase=time*50;

  // 背景
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  grad.addColorStop(0,'#0a0a2e');grad.addColorStop(0.5,'#050520');grad.addColorStop(1,'#000005');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  drawBgStars(time);

  // 判断手势模式
  const prevMode = gestureMode;
  const prevFingers = currentFingers;
  if(handData.length >= 2) {
    stabilizeGesture('hands', -1);
  } else if(handData.length === 1) {
    const hd = handData[0];
    // 拳头与手指互斥：有手指伸开时不判定为拳头
    const effectiveFist = hd.isFist && hd.fingers <= 1;
    if(effectiveFist) stabilizeGesture('fist', 0);
    else if(hd.fingers === 5) stabilizeGesture('love', 5);
    else if(hd.fingers >= 1 && hd.fingers <= 4) stabilizeGesture('number', hd.fingers);
    else stabilizeGesture('idle', -1);
  } else {
    stabilizeGesture('idle', -1);
  }

  // 形状切换
  const numberChanged = gestureMode === 'number' && currentFingers !== prevFingers;
  const needsShape = gestureMode !== lastShapedMode || numberChanged || (gestureMode === 'number' && currentFingers !== lastShapedFingers);
  if(needsShape) {
    if(gestureMode === 'love') setLoveShape();
    else if(gestureMode === 'hands') {
      // targets set per-frame in update
    } else if(gestureMode === 'number') setShape(currentFingers);
    lastShapedMode = gestureMode;
    lastShapedFingers = currentFingers;
    if(gestureMode !== prevMode || numberChanged) log(`模式: ${gestureMode}` + (gestureMode === 'number' ? ` (${currentFingers}指)` : handData.length ? ` (${handData.length}手)` : ''));
  }

  // 双手模式持续更新目标
  if(gestureMode === 'hands' && handData.length >= 2) {
    const half = Math.floor(PARTICLE_COUNT / 2);
    const pts0 = generateHandPoints(handData[0].landmarks, half);
    const pts1 = generateHandPoints(handData[1].landmarks, PARTICLE_COUNT - half);
    const allPts = [...pts0, ...pts1];
    setHandShape(allPts);
    drawHandsGlow(time, handData[0].centerX*W, handData[0].centerY*H,
                       handData[1].centerX*W, handData[1].centerY*H);
  }

  // 单手拳头持续更新
  if(gestureMode === 'fist' && handData.length === 1) {
    const hd = handData[0];
    particles.forEach(p => p.fistUpdate(time, hd.centerX*W, hd.centerY*H));
  }

  const isEnhanced = (gestureMode==='love' || gestureMode==='hands');
  if(gestureMode==='love') drawLoveGlow(time);

  for(const p of particles) {
    if(gestureMode==='idle') p.idleUpdate(time);
    // fist/hands targets already set above
    if(gestureMode==='love') { p.loveUpdate(time, lovePhase); p._loveMode=true; }
    else if(gestureMode==='hands') { p.handsUpdate(time); p._loveMode=true; }
    else { p.numberUpdate(time); p._loveMode=false; }
    p.update(time);
    p.draw(isEnhanced);
  }

  if(gestureMode==='love') { emitSparkles(time); updateSparkles(); }
  if(gestureMode==='hands') { emitSparkles(time); updateSparkles(); }

  drawAllHands();
  drawText();
  requestAnimationFrame(animate);
}

let animationStarted = false;
function startAnimation() {
  if(animationStarted) return;
  animationStarted = true;
  animate();
}

let cameraActive = false;
let sendingFrame = false;
let lastHandFrameTime = 0;

async function openCameraStream() {
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('当前浏览器不支持摄像头访问');
  }
  const constraintsList = [
    {audio:false, video:{width:{ideal:PERF.cameraWidth}, height:{ideal:PERF.cameraHeight}, facingMode:{ideal:'user'}}},
    {audio:false, video:{facingMode:'user'}},
    {audio:false, video:true}
  ];
  let lastError;
  for(const constraints of constraintsList) {
    try {
      return await navigator.mediaDevices.getUserMedia(constraints);
    } catch(err) {
      lastError = err;
    }
  }
  throw lastError || new Error('摄像头打开失败');
}

function startHandFrameLoop(hands) {
  cameraActive = true;
  const handFrameInterval = 1000 / PERF.handFps;
  async function sendFrame() {
    if(!cameraActive) return;
    const now = performance.now();
    if(video.readyState >= 2 && !sendingFrame && now - lastHandFrameTime >= handFrameInterval) {
      lastHandFrameTime = now;
      sendingFrame = true;
      try {
        await hands.send({image:video});
      } catch(err) {
        console.warn('[Star] hand frame failed', err);
      }
      sendingFrame = false;
    }
    requestAnimationFrame(sendFrame);
  }
  sendFrame();
}

// ==================== MediaPipe 初始化 ====================
async function init() {
  if(typeof Hands==='undefined') {
    log('错误: MediaPipe Hands 未加载');
    loading.innerHTML='<div style="color:#ff6b6b;text-align:center;max-width:420px;padding:20px;"><p style="font-size:18px">MediaPipe 加载失败</p><p style="font-size:13px;color:#888;margin-top:8px">请检查网络后刷新</p></div>';
    startAnimation(); return;
  }
  log(`性能模式: ${PERF.label} / ${PARTICLE_COUNT} 粒子 / ${PERF.handFps}fps识别`);
  try {
    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
    });
    hands.setOptions({
      maxNumHands: MAX_HANDS,
      modelComplexity: PERF.modelComplexity,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(results => {
      const prevCount = handData.length;
      handData = [];
      if(results.multiHandLandmarks) {
        for(let i=0; i<results.multiHandLandmarks.length; i++) {
          const raw = results.multiHandLandmarks[i];
          const lms = smoothHand(raw, i);
          const rawFingers = countFingers(lms);
          const fingers = i === 0 ? getSmoothedFingers(rawFingers) : rawFingers;
          const isFist = detectFist(lms);
          const cx = lms[0].x, cy = lms[0].y;
          handData.push({landmarks:lms, fingers, isFist, centerX:cx, centerY:cy});
        }
      }
      if(handData.length !== prevCount) {
        handSmoothed = [handData[0]?handSmoothed[0]:null, handData[1]?handSmoothed[1]:null];
      }
      if(handData.length===0) handSmoothed=[null,null];
    });
    log('请求摄像头...');
    video.muted = true;
    video.playsInline = true;
    const stream = await openCameraStream();
    video.srcObject = stream;
    await video.play();
    startHandFrameLoop(hands);
    loading.classList.add('hidden');
    log('双手手势检测已启动');
    startAnimation();
  } catch(err) {
    log('失败: '+err.message);
    loading.innerHTML=`<div style="color:#ff6b6b;text-align:center;max-width:420px;padding:20px;"><p style="font-size:18px;margin-bottom:12px">初始化失败</p><p style="font-size:14px;color:#aaa">${err.message}</p><p style="font-size:13px;color:#888;margin-top:12px">请用 localhost 或 HTTPS 访问</p></div>`;
    startAnimation();
  }
}
startAnimation();
startBtn.addEventListener('click', () => {
  startOverlay.classList.add('hidden');
  loading.classList.remove('hidden');
  init();
}, {once:true});
</script>
